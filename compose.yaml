services:
  flight_service:
    build:
      context: flight_service
    environment:
      FLIGHT_SERVICE_DB_PROTOCOL: ${FLIGHT_SERVICE_DB_PROTOCOL}
      FLIGHT_SERVICE_DB_USER: ${FLIGHT_SERVICE_DB_USER}
      FLIGHT_SERVICE_DB_PASSWORD: ${FLIGHT_SERVICE_DB_PASSWORD}
      FLIGHT_SERVICE_DB_HOST: postgres
      FLIGHT_SERVICE_DB_PORT: ${FLIGHT_SERVICE_DB_PORT}
      FLIGHT_SERVICE_DB_NAME: ${FLIGHT_SERVICE_DB_NAME}
    ports:
      - 8060:8060

# The commented out section below is an example of how to define a PostgreSQL
# database that your application can use. `depends_on` tells Docker Compose to
# start the database before your application. The `db-data` volume persists the
# database data between container restarts. The `db-password` secret is used
# to set the database password. You must create `db/password.txt` and add
# a password of your choosing to it before running `docker compose up`.
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:18
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql
      - ./postgres/:/docker-entrypoint-initdb.d/
    expose:
      - 5432
volumes:
  db-data:
