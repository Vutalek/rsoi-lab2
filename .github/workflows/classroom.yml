name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
env:
  FLIGHT_SERVICE_HOST: http://flight_service:8060
  TICKET_SERVICE_HOST: http://ticket_service:8070
  BONUS_SERVICE_HOST: http://bonus_service:8050
  FLIGHT_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  FLIGHT_SERVICE_DB_USER: program
  FLIGHT_SERVICE_DB_PASSWORD: test
  FLIGHT_SERVICE_DB_PORT: "5432"
  FLIGHT_SERVICE_DB_NAME: flights
  TICKET_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  TICKET_SERVICE_DB_USER: program
  TICKET_SERVICE_DB_PASSWORD: test
  TICKET_SERVICE_DB_PORT: "5432"
  TICKET_SERVICE_DB_NAME: tickets
  BONUS_SERVICE_DB_PROTOCOL: postgresql+psycopg2
  BONUS_SERVICE_DB_USER: program
  BONUS_SERVICE_DB_PASSWORD: test
  BONUS_SERVICE_DB_PORT: "5432"
  BONUS_SERVICE_DB_NAME: privileges
jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: |
          for service in flight_service ticket_service bonus_service; do
            (
              cd "$service"
              python -m pip install -r requirements.txt
              python -m pytest
            ) || exit 1
          done

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

  postman:
    name: Postman tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run containers
        timeout-minutes: 15
        run: |
          docker compose up -d --build
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          # TODO insert your variant
          collection: postman/collection.json
          environment: postman/environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{secrets.GOOGLE_API_KEY}}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 2
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v
